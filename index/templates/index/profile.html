{% load static %}

<html>
    <head>
        <title> 
            {{ TheProfile.user }}'s profile
        </title>

        <style>
              *{
                background-color:  rgb(183, 59, 35);
               
                
            }

              html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            }

           .navbar{
                background-color: rgba(254, 209, 163, 0.5);
                color: rgb(71, 28, 28);
                display: flex;
                flex-direction: row;
                width: 100%;
                align-items: center;
                justify-content:flex-start;
                gap: 2vw;
            }

            .navbar img{
                width: 6vw;
                height: 4vw;
                background-color: transparent;
            }

            .navbar p{
                background-color: transparent;
                color: #522a21;
                justify-content: center;
                align-items: center;
                text-align: center;
                font-family: "Fjalla One", sans-serif;  
                font-size: clamp(1rem, 2vw, 4rem);
                font-style: normal;
                margin: 0   ;
                line-height: -100px;
            }
            .navbar a{
                background-color: transparent;
            } 
        </style>
    </head>
    <body>

         


        <div class="navbar">
            <a href="{% url 'index:home'%}">
                <img src="{% static 'index/img/bulletinlogo.png'  %}">
            </a>
            
            <a href="{%url 'index:post_list'%}">
                <p>Post List</p>
            </a>

            <a href="{% url 'index:editprofile' %}">
                <p>Profile</p>
            </a>

            <a href="{% url 'index:post' %}">
                <p>Post Something</p>
            </a>
        </div>

        {% if TheProfile.pfp %}
            <img src="{{ TheProfile.pfp.url }}" alt="profile picture">
        {% else %}
            <img src="{% static "index/img/blank-pfp.jpg"  %}">
        {% endif %}
        
        {{ TheProfile.user }} </br>
        {{ TheProfile.hobby }} </br>
        {{ TheProfile.quote }} </br>
    </body>
</html>
