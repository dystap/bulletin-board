<!DOCTYPE html>
    <html>
        <head>
            <title>Posts</title>
        </head>

        <body>
            <div class="Posts">

                {% for Post in posts %}
                    <div class="PostsUI">
                        <h2>{{ Post.post }}</h3>
                        <h3> Topic: {{ Post.topic }} </h3>
                        <h3> By: {{ Post.user }}</h2>
                        <p>{{ Post.description }}</p>


                        {% if Post.image %}
                            <img src="{{ Post.image.url }}" alt="Post Image">
                        {% endif %}
                    </div>
                {% endfor %}

            </div>
        </body>

    </html>
