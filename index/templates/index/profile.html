{% load static %}

<html>
    <head>
        <title> 
            {{ TheProfile.user }}'s profile
        </title>
    </head>
    <body>
        {% if TheProfile.pfp %}
            <img src="{{ TheProfile.pfp.url }}" alt="profile picture">
        {% else %}
            <img src="{% static "index/img/blank-pfp.jpg"  %}">
        {% endif %}
        
        {{ TheProfile.user }} </br>
        {{ TheProfile.hobby }} </br>
        {{ TheProfile.quote }} </br>
    </body>
</html>
