{% load static %}

<html>
    <head>
         <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0"/>
        <title>Make User</title>

            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">

            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
        <style>
            

             * {
                background-color:  rgb(183, 59, 35);
                
            }
            body {
               
                font-family: "Roboto Slab", serif;
                font-optical-sizing: auto;
                font-weight: 1rem;
                
            }


            .form-control {
                border-radius: 0.5em;
                padding: 0.5em;
                background: transparent;
                background-color:  rgb(254, 209, 163);
            }
            .form-control div, .form-control input, .form-control label, .form-control ul, .form-control li{
                background: rgb(254, 209, 163);
            }

            .title{
                background-color:  rgb(254, 209, 163);
                padding: 20px;
                border-radius: 8px;
                font-family: "Fjalla One", sans-serif;
                font-weight: 400;
                font-size: clamp(1.8rem, 5vw, 3.5rem);
                font-style: normal;
                display: flex;
                flex-direction: row;
                gap: 10px; 
            }

            .form-container{
                background-color:  rgb(254, 209, 163);
            }
             .button{
                 background: rgb(238, 102, 75);
                
                margin: auto;
                margin-top: 10px;
                padding: 0.5em;
                border-radius: 5px;
                border: 2rem;
                border-color: rgb(255, 255, 255);;
                color: rgb(71, 28, 28);
                justify-content: left ;
                align-items: left;
            }
            
.navbar{
                background-color: rgba(254, 209, 163, 0.5);
                color: rgb(71, 28, 28);
                display: flex;
                flex-direction: row;
                width: 100%;
                align-items: center;
                justify-content:flex-start;
                gap: 2vw;
            }

            .navbar img{
                width: 6vw;
                height: 4vw;
                background-color: transparent;
            }

            .navbar p{
                background-color: transparent;
                color: #522a21;
                justify-content: center;
                align-items: center;
                text-align: center;
                font-family: "Fjalla One", sans-serif;  
                font-size: clamp(1rem, 2vw, 4rem);
                font-style: normal;
                margin: 0   ;
                line-height: -100px;
            }
            .navbar a{
                background-color: transparent;
            }
        </style>
    </head>
    <body>

         


        <div class="navbar">
            <a href="{% url 'index:home'%}">
                <img src="{% static 'index/img/bulletinlogo.png'  %}">
            </a>
            
            <a href="{%url 'index:post_list'%}">
                <p>Post List</p>
            </a>

            <a href="{% url 'index:editprofile' %}">
                <p>Profile</p>
            </a>

            <a href="{% url 'index:post' %}">
                <p>Post Something</p>
            </a>
        </div>


        {% if user.is_authenticated %}
        tests
        {% else %}
            <h1 class="title">Create your user!</h1>

            <div class=""form-container>
                <form action="{% url 'index:makeuser' %}" method="POST" class="form-control">
                {% csrf_token %}

                {{ form.as_div }}

                <button type="submit" class="button">Post</button>

            </form>
            </div>
            
        {% endif %}

    </body>
</html>
